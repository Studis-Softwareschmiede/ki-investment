estimate_note: 'docker-compose.yml referenziert im ''migrations''-Service ./db_scripts/run-migrations.sh
  (mountet ./db_scripts:/db_scripts:ro, Image postgres:17-alpine) — das Skript FEHLT
  im Repo, daher greift die automatische Migration beim compose-up nicht (DB bliebe
  leer). Zusätzlicher Befund (2026-07-18, lokales Deploy): das Produktions-Image (Dockerfile
  Stage 2) kopiert nur /app/app + /app/.venv, NICHT alembic.ini — der App-Container
  kann ''alembic upgrade head'' nicht selbst ausfuehren (''No script_location'').
  Zu klaeren/umzusetzen: (a) run-migrations.sh anlegen, das die alembic-Migrationen
  appliziert; da der migrations-Service nur psql mitbringt (postgres-image), entweder
  das Service-Image auf ein alembic-faehiges (Python) umstellen ODER ''alembic upgrade
  --sql'' rendern und via psql einspielen; (b) alternativ alembic.ini + migrations
  ins Prod-Image aufnehmen. Aktuell im lokalen Deploy per Host-alembic umgangen.'
