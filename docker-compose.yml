# docker-compose — gemergt aus templates/_shared/db-postgres + companion-redis compose.fragment.yml
services:
  db:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME:-app}_db
    restart: unless-stopped
    env_file:
    - .env.db
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "${POSTGRES_USER:-app}" -d "${POSTGRES_DB:-app}"
      interval: 5s
      timeout: 3s
      retries: 20
  migrations:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME:-app}_migrations
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    env_file:
    - .env.db
    environment:
      DB_HOST: db
    entrypoint:
    - /db_scripts/run-migrations.sh
    volumes:
    - ./db_scripts:/db_scripts:ro
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-app}_redis
    restart: unless-stopped
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db_data: {}
  redis_data: {}
